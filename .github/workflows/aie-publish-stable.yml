name: AIE Publish Stable VSIX

on:
  push:
    tags:
        - "v*-aie"

permissions:
  contents: write

jobs:
  publish-stable:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          install-args: "--frozen-lockfile"

      - name: Build VSIX
        run: |
          pnpm vsix
          ls -la bin/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}" 
          gh release create "$TAG" \
            --title "AIE ${TAG}" \
            --notes "AIE stable release" \
            bin/*.vsix
