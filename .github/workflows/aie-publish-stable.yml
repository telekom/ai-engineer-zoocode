name: AIE Publish Stable VSIX

on:
  push:
    tags:
        - "v*-aie"

permissions:
  contents: write

jobs:
  publish-stable:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          install-args: "--frozen-lockfile"

      - name: Build VSIX
        run: |
          pnpm vsix
          ls -la bin/
      
      - name: Fetch tags
        run: git fetch --tags

      - name: Debug ref
        run: |
          echo "GITHUB_REF=$GITHUB_REF"
          echo "GITHUB_REF_NAME=$GITHUB_REF_NAME"
          git tag

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release exists, uploading VSIX"
            gh release upload "$TAG" bin/*.vsix --clobber
          else
            echo "Creating release"
            gh release create "$TAG" \
              --verify-tag \
              --target "${GITHUB_SHA}" \
              --title "AIE ${TAG}" \
              --notes "AIE stable release" \
              bin/*.vsix
          fi
