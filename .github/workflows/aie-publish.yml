name: AIE Publish VSIX

on:
  workflow_run:
    workflows: ["AIE Build VSIX"]
    types:
      - completed

  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          install-args: "--frozen-lockfile"

      - name: Download VSIX artifact
        uses: actions/download-artifact@v4
        with:
          name: aie-vsix
          path: bin

      - name: Verify VSIX artifact
        run: |
            ls -la bin/

      - name: Fetch tags
        run: git fetch --tags

      - name: Determine pre-release version
        id: version
        run: |
          BASE_VERSION=$(node -p "require('./src/package.json').version")

          EXISTING_TAGS=$(git tag -l "v${BASE_VERSION}-a.*" || true)

          if [ -z "$EXISTING_TAGS" ]; then
            NEXT_COUNTER=1
          else
            LATEST_COUNTER=$(echo "$EXISTING_TAGS" | sed "s/v${BASE_VERSION}-a\.//" | sort -n | tail -1)
            NEXT_COUNTER=$((LATEST_COUNTER + 1))
          fi

          PRERELEASE_VERSION="${BASE_VERSION}-a.${NEXT_COUNTER}"

          echo "version=${PRERELEASE_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"

          gh release create "$TAG" \
            --prerelease \
            --title "AIE ${TAG}" \
            --notes "AIE pre-release build" \
            --target "$GITHUB_SHA" \
            bin/*.vsix