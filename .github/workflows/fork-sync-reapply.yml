# Manual re-apply onto a pristine upstream tag.
# Pins telekom/ai-engineer-fork-sync at a commit SHA. A branch is not a pin.
# Creates sync/<version>-aie and v<version>-test only. vX.Y.Z-aie stays manual.
#
# Repository secrets (Actions will not store values from this file):
#   PROJECT_ACCESS_TOKEN  push the sync branch, the v*-test tag, and open the draft PR
#   AIE_API_KEY           LLM Hub credential
#   LANGFUSE_PUBLIC_KEY
#   LANGFUSE_SECRET_KEY
# The runner must be able to reach https://llm-server.llmhub.t-systems.net
# and https://llmops.telekom.de. FORK_SYNC_CHEAP_MODEL is a hub model id.
name: Fork sync re-apply

on:
  workflow_dispatch:
    inputs:
      UPSTREAM_TAG:
        description: Pristine upstream tag (for example v3.80.1)
        required: true
        type: string
      AIE_REF:
        description: Last shipped *-aie tag
        required: true
        type: string
        default: v3.72.0-3-aie

permissions:
  contents: read

jobs:
  reapply:
    uses: telekom/ai-engineer-fork-sync/.github/workflows/fork-sync.yml@0e1dd76db5b5ad60148f5935e4ff6a2870c54e6f
    with:
      upstream_tag: ${{ inputs.UPSTREAM_TAG }}
      aie_ref: ${{ inputs.AIE_REF }}
      job: reapply
      fork_sync_engine_repo: telekom/ai-engineer-fork-sync
      fork_sync_engine_ref: 0e1dd76db5b5ad60148f5935e4ff6a2870c54e6f
      fork_sync_cheap_model: ai-engineer/GLM-5.3-Flash
    secrets:
      PROJECT_ACCESS_TOKEN: ${{ secrets.PROJECT_ACCESS_TOKEN }}
      AIE_API_KEY: ${{ secrets.AIE_API_KEY }}
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
